version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swarmwork
    ports:
      - "5433:5432"
    volumes:
      - swarmwork-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/swarmwork
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - db

volumes:
  swarmwork-data:
